name: Validate KCC SoundLab

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Python syntax
        run: python -m compileall -q custom_components/kcc_soundlab

      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("custom_components/kcc_soundlab").rglob("*.json"):
              with path.open(encoding="utf-8") as handle:
                  json.load(handle)
              print(f"OK {path}")
          with Path("hacs.json").open(encoding="utf-8") as handle:
              json.load(handle)
          print("OK hacs.json")
          PY

      - name: Validate frontend JavaScript
        run: |
          node --check custom_components/kcc_soundlab/frontend/kcc-soundlab-panel.js
          node --check custom_components/kcc_soundlab/frontend/ui-utils.js
          node --check custom_components/kcc_soundlab/frontend/ui-views.js
          node --check custom_components/kcc_soundlab/frontend/ui-measurement.js
          node --check custom_components/kcc_soundlab/frontend/ui-crossover.js
          node --check custom_components/kcc_soundlab/frontend/ui-eq.js

      - name: Validate frontend module cache consistency
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          frontend = Path("custom_components/kcc_soundlab/frontend")
          errors = []
          versions = set()
          pattern = re.compile(r'from["\'](\./[^"\']+\.js)(?:\?v=([^"\']+))?["\']')
          for path in frontend.glob("*.js"):
              text = path.read_text(encoding="utf-8")
              for specifier, found_version in pattern.findall(text):
                  if not found_version:
                      errors.append(f"{path}: local JS import lacks version query: {specifier}")
                  else:
                      versions.add(found_version)
          if len(versions) > 1:
              errors.append(f"Mixed frontend module cache versions: {sorted(versions)}")
          if errors:
              raise SystemExit("\n".join(errors))
          print(f"OK local frontend JS imports use one consistent cache key: {next(iter(versions), 'none')}")
          PY